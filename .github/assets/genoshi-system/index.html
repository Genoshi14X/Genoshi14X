<!doctype html>
<html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>GENOSHI SYSTEM — preview</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#060b10;color:#b7cbd1;font:14px ui-monospace,monospace;display:grid;place-items:center;padding:32px}main{width:min(100%,960px)}header{display:flex;justify-content:space-between;gap:20px;align-items:center;margin-bottom:18px}h1{font-size:14px;letter-spacing:.12em;color:#8ef5bb}small{color:#6d8992}canvas{display:block;width:100%;height:auto;border-radius:8px;box-shadow:0 20px 80px #0008}nav{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}button,a{font:inherit;background:#101f29;border:1px solid #29424e;color:#a9eacb;padding:11px 15px;border-radius:6px;cursor:pointer;text-decoration:none}button:hover,a:hover{border-color:#8ef5bb}button:disabled{opacity:.5;cursor:wait}p{font-size:12px;line-height:1.7;color:#6d8992}input{width:100%;accent-color:#8ef5bb;margin-top:20px}#status{min-height:22px}
</style>
<main><header><h1>GENOSHI / SYSTEM PREVIEW</h1><small>960 × 360 · 12 s · loop</small></header>
<canvas width="960" height="360" role="img" aria-label="Терминал GENOSHI SYSTEM: загрузка, ошибка мотивации, повторная попытка и успешный запуск"></canvas>
<input id="timeline" type="range" min="0" max="11999" value="0" aria-label="Позиция анимации">
<nav><button id="pause">Пауза</button><button id="restart">Сначала</button><button id="png">Скачать PNG</button><button id="frames">Экспорт кадров</button><a href="genoshi-system.gif" download>Скачать GIF</a></nav>
<p id="status" aria-live="polite">Автономный предпросмотр · без внешних шрифтов и запросов к сети</p>
<p>GIF для README уже лежит рядом. Экспорт кадров сохраняет один файл для повторной сборки GIF через export_gif.py.</p></main>
<script>
const W=960,H=360,DURATION=12000;
function render(ctx,time){
 const t=((time%DURATION)+DURATION)%DURATION, green='#8ef5bb',cyan='#76dcea',muted='#56747c';
 ctx.fillStyle='#080f16';ctx.fillRect(0,0,W,H);
 function box(x,y,w,h,color){ctx.fillStyle=color;ctx.fillRect(x,y,w,h)}
 function text(s,x,y,size=13,color=green){ctx.font=`${size}px monospace`;ctx.fillStyle=color;ctx.fillText(s,x,y)}
 box(1,1,958,358,'#1d3842');box(2,2,956,356,'#0b141d');
 box(2,2,956,35,'#101f29');
 ['#e68583','#dfc17a','#7edbaa'].forEach((c,i)=>{ctx.beginPath();ctx.fillStyle=c;ctx.arc(20+i*18,19,4,0,Math.PI*2);ctx.fill()});
 text('genoshi@system: ~ / boot',90,24,12,'#8da5ad');text('TERMINAL / 01',800,24,11,muted);
 text('PERSONAL COMPUTING DIVISION',30,66,10,muted);
 text('GENOSHI',27,119,51,green);text('SYSTEM',272,119,51,cyan);
 text('BUILD. BREAK. DEBUG. REPEAT.',31,145,12,'#8da5ad');
 box(30,164,900,1,'#203740');box(679,184,1,133,'#203740');
 const rows=[
  [450,'> Initializing GENOSHI kernel...',green],
  [1700,'[ OK ] Loading curiosity.dll',green],
  [2900,'[ OK ] Mounting caffeine.sys',green],
  [4100,'ERROR: Motivation not found','#ef9b8d'],
  [5800,'> RETRYING...'+(t>=7900?' OK':''),t>=7900?green:'#e5ca88'],
  [8200,'> System ready. Let\'s build something.',cyan]
 ];
 rows.forEach(([start,s,c],i)=>{if(t>=start){const n=Math.min(s.length,Math.floor((t-start)/27));text(s.slice(0,n),32,190+i*23,14,c);if(n<s.length&&Math.floor(t/220)%2===0)box(32+n*8.43,178+i*23,8,15,c)}});
 text('BOOT SEQUENCE',704,194,10,muted);
 let progress=t<4100?Math.min(72,t/4100*72):t<5800?72:t<8200?72+(t-5800)/2400*28:100;
 text(String(Math.floor(progress)).padStart(3,'0')+'%',704,231,29,t>=4100&&t<5800?'#ef9b8d':cyan);
 for(let i=0;i<20;i++)box(705+i*10,247,7,13,i<progress/5?green:'#20313a');
 text(t<4100?'LOADING MODULES':t<5800?'RECOVERABLE ERROR':t<8200?'RECOVERY IN PROGRESS':'ALL SYSTEMS ONLINE',704,284,10,t>=4100&&t<5800?'#ef9b8d':green);
 if(t>=9400){text('$',32,328,14,green);if(Math.floor(t/500)%2===0)box(50,316,9,16,cyan)}
 box(2,341,956,17,'#101f29');text('GENOSHI OS / v1.0',14,353,9,muted);text('SESSION: '+(t>=8200?'READY':'BOOTING'),779,353,9,muted);
 ctx.fillStyle='rgba(0,0,0,.10)';for(let y=38;y<341;y+=4)ctx.fillRect(2,y,956,1);
}

const canvas=document.querySelector('canvas'),ctx=canvas.getContext('2d'),timeline=document.querySelector('#timeline');
let elapsed=0,last=performance.now(),paused=matchMedia('(prefers-reduced-motion: reduce)').matches;
if(paused)elapsed=10000;
const pause=document.querySelector('#pause');function label(){pause.textContent=paused?'Продолжить':'Пауза'}label();
function tick(now){if(!paused)elapsed=(elapsed+now-last)%DURATION;last=now;render(ctx,elapsed);timeline.value=elapsed;requestAnimationFrame(tick)}requestAnimationFrame(tick);
pause.onclick=()=>{paused=!paused;label()};document.querySelector('#restart').onclick=()=>{elapsed=0;last=performance.now()};timeline.oninput=()=>{elapsed=+timeline.value;paused=true;label()};
function save(blob,name){const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),10000)}
document.querySelector('#png').onclick=()=>canvas.toBlob(b=>save(b,'genoshi-system.png'));
document.querySelector('#frames').onclick=async function(){this.disabled=true;const target=document.createElement('canvas');target.width=W;target.height=H;const c=target.getContext('2d'),frames=[];try{for(let i=0;i<120;i++){render(c,i*100);frames.push(target.toDataURL('image/png').split(',')[1]);if(i%10===0){document.querySelector('#status').textContent=`Экспорт кадров: ${i}/120`;await new Promise(r=>setTimeout(r,0))}}save(new Blob([JSON.stringify({width:W,height:H,fps:10,frames})],{type:'application/json'}),'genoshi-frames.json');document.querySelector('#status').textContent='Готово. Соберите GIF: python3 export_gif.py genoshi-frames.json'}catch(e){document.querySelector('#status').textContent='Не удалось сохранить кадры: '+e.message}finally{this.disabled=false}};
</script></html>
