name: AniList Anime

on:
  schedule:
    - cron: "0 1 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  anime:
    runs-on: ubuntu-latest

    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}

          user: Genoshi14X

          filename: anime.svg
          output_action: commit

          template: classic
          base: ""

          plugin_anilist: yes
          plugin_anilist_user: Genoshi14

          plugin_anilist_medias: anime
          plugin_anilist_sections: watching, favorites

          plugin_anilist_limit: 5