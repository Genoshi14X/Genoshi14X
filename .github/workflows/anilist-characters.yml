name: AniList Characters

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  characters:
    runs-on: ubuntu-latest

    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}

          user: Genoshi14X

          filename: characters.svg
          output_action: commit

          template: classic
          base: ""

          plugin_anilist: yes
          plugin_anilist_user: Genoshi14

          plugin_anilist_sections: characters

          plugin_anilist_limit_characters: 8