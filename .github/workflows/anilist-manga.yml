name: AniList Manga

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  manga:
    runs-on: ubuntu-latest

    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}

          user: Genoshi14X

          filename: manga.svg
          output_action: commit

          template: classic
          base: ""

          plugin_anilist: yes
          plugin_anilist_user: Genoshi14

          plugin_anilist_medias: manga
          plugin_anilist_sections: reading, favorites

          plugin_anilist_limit: 5