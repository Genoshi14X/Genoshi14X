name: AniList Metrics

on:
  schedule:
    - cron: "0 1 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  anilist:
    runs-on: ubuntu-latest

    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}

          user: Genoshi14X
          filename: metrics.plugin.anilist.svg
          output_action: commit

          template: classic

          base: ""

          config_timezone: Asia/Tokyo
          config_theme: github-dark

          plugin_anilist: yes
          plugin_anilist_user: Genoshi14

          plugin_anilist_sections: watching, reading, favorites, characters

          plugin_anilist_limit: 6
          plugin_anilist_shuffle: true