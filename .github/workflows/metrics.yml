name: GitHub Metrics

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  metrics:
    runs-on: ubuntu-latest

    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}

          user: Genoshi14X

          template: classic
          base: header, activity, community, repositories

          plugin_anilist: yes
          plugin_anilist_user: Genoshi14
          plugin_anilist_sections: |
              favorites
              watching
              reading