name: GitHub Metrics

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  github-metrics:
    runs-on: ubuntu-latest

    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}

          user: Genoshi14X
          filename: github-metrics.svg

          template: classic
          base: header, activity, community, repositories, metadata


  anilist:
    runs-on: ubuntu-latest

    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: NOT_NEEDED

          user: Genoshi14X
          filename: metrics.plugin.anilist.svg

          base: ""

          plugin_anilist: yes
          plugin_anilist_user: Genoshi14
          plugin_anilist_sections: favorites, watching, reading
          plugin_anilist_limit: 5